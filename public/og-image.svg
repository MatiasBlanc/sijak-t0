<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgGlow" cx="65%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#c6ff00" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#14171a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0e0f10" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="sensorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c6ff00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c6ff00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c1f" />
      <stop offset="100%" stop-color="#0e1012" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c6ff00" />
      <stop offset="100%" stop-color="#e2ff66" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="limeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#c6ff00" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0e0f10" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer frame borders -->
  <line x1="60" y1="100" x2="1140" y2="100" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="535" x2="1140" y2="535" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Header -->
  <text x="60" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-1.5" fill="#f7f7f2">SIJAK</text>
  <text x="175" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" fill="#c6ff00">✳</text>

  <!-- Header Right Status Pill -->
  <rect x="910" y="44" width="230" height="36" rx="18" fill="#141719" stroke="#c6ff00" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="932" cy="62" r="4.5" fill="#c6ff00" filter="url(#limeShadow)" />
  <text x="948" y="67" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#c6ff00">LLEGA EN 2027</text>

  <!-- Left Content: Eyebrow -->
  <rect x="60" y="145" width="270" height="26" fill="#c6ff00" fill-opacity="0.1" stroke="#c6ff00" stroke-opacity="0.3" stroke-width="1" />
  <circle cx="75" cy="158" r="3" fill="#c6ff00" />
  <text x="88" y="162" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#c6ff00">SENSOR MODULAR DE COMBATE</text>

  <!-- Main Headline -->
  <text x="60" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="-2.5" fill="#f7f7f2">MIDE LO QUE ANTES</text>
  <text x="60" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="-2.5" fill="#c6ff00" filter="url(#limeShadow)">NO PODÍAS.</text>

  <!-- Subtitle -->
  <text x="60" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#a4aba6">Telemetría de precisión para atletas y entrenadores de combate.</text>
  <text x="60" y="393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#7d8881">Reacción · Ejecución · Impacto · Recuperación</text>

  <!-- Metric Badges Row -->
  <g transform="translate(60, 435)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="145" height="60" fill="#14171a" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <text x="14" y="22" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" fill="#7d8881" letter-spacing="1">REACCIÓN</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace, sans-serif" font-size="22" font-weight="700" fill="#f7f7f2">184 <tspan font-size="11" font-weight="400" fill="#7d8881">ms</tspan></text>

    <!-- Metric 2 -->
    <rect x="160" y="0" width="145" height="60" fill="#14171a" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <text x="174" y="22" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" fill="#7d8881" letter-spacing="1">EJECUCIÓN</text>
    <text x="174" y="48" font-family="'JetBrains Mono', monospace, sans-serif" font-size="22" font-weight="700" fill="#f7f7f2">213 <tspan font-size="11" font-weight="400" fill="#7d8881">ms</tspan></text>

    <!-- Metric 3 -->
    <rect x="320" y="0" width="165" height="60" fill="#161c14" stroke="#c6ff00" stroke-opacity="0.4" stroke-width="1" />
    <text x="334" y="22" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" fill="#c6ff00" letter-spacing="1">RECUPERACIÓN</text>
    <text x="334" y="48" font-family="'JetBrains Mono', monospace, sans-serif" font-size="22" font-weight="700" fill="#c6ff00">247 <tspan font-size="11" font-weight="400" fill="#c6ff00">ms</tspan></text>
  </g>

  <!-- Right Visual: T0 Device & Tech Graphic -->
  <g transform="translate(730, 130)">
    <!-- Radar orbits -->
    <circle cx="210" cy="180" r="190" fill="none" stroke="#c6ff00" stroke-opacity="0.08" stroke-dasharray="4 6" />
    <circle cx="210" cy="180" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.06" />
    <circle cx="210" cy="180" r="90" fill="url(#sensorGlow)" />

    <!-- Connection curve -->
    <path d="M 50 280 C 120 270, 150 120, 310 150" fill="none" stroke="#c6ff00" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7" />
    <circle cx="50" cy="280" r="4" fill="#c6ff00" />
    <circle cx="310" cy="150" r="4" fill="#c6ff00" />

    <!-- T0 Hardware Body -->
    <g transform="translate(95, 65)" filter="url(#shadow)">
      <!-- Outer Chamfered Case -->
      <rect x="0" y="0" width="230" height="230" rx="42" fill="url(#cardGrad)" stroke="#4b5550" stroke-width="2" />
      <rect x="8" y="8" width="214" height="214" rx="36" fill="#121517" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

      <!-- Center Diffuser Ring -->
      <circle cx="115" cy="115" r="56" fill="#1b2022" stroke="#c6ff00" stroke-width="3" filter="url(#limeShadow)" />
      <circle cx="115" cy="115" r="44" fill="#101314" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

      <!-- Core Spark / SIJAK Emblem -->
      <text x="115" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="700" fill="#c6ff00" text-anchor="middle">✳</text>

      <!-- Corner Telemetry Marks -->
      <text x="24" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f7f7f2">T0</text>
      <text x="175" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7d8881">MOD-1</text>
      <text x="24" y="206" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c6ff00">DUAL</text>
      <text x="160" y="206" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#7d8881">1 ms/SYNC</text>

      <!-- Bayonet Mount indicators -->
      <circle cx="28" cy="115" r="3" fill="#7d8881" />
      <circle cx="202" cy="115" r="3" fill="#7d8881" />
      <circle cx="115" cy="28" r="3" fill="#7d8881" />
      <circle cx="115" cy="202" r="3" fill="#7d8881" />
    </g>

    <!-- Floating HUD Tag -->
    <g transform="translate(145, 315)">
      <rect x="0" y="0" width="130" height="26" rx="4" fill="#0e0f10" stroke="#c6ff00" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="14" cy="13" r="3" fill="#c6ff00" />
      <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1" fill="#f7f7f2">TELEMETRÍA 360°</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="60" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f7f7f2">sijak-t0.vercel.app</text>
  <text x="235" y="580" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#7d8881">·</text>
  <text x="250" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#8e9893">Todos empezamos aquí.</text>

  <text x="1005" y="580" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#c6ff00">DISEÑADO EN CHILE</text>
</svg>
